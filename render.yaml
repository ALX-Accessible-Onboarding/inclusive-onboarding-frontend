services:
  - type: web
    name: inclusive-onboarding-frontend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dev-server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        value: https://inclusive-onboarding-backend.onrender.com/api/v1

